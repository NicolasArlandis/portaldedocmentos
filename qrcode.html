<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>QR Code – Universidade Cruzeiro do Sul</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .qr-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-card img {
      display: block;
      width: 100%;
      max-width: 280px;
      height: auto;
      margin-top: 12px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>QR Code</h1>
      <span></span>
    </header>

    <main class="content">
      <a class="brand" data-redirect>
        <span class="brand-logo" aria-hidden="true"><img src="logo-estrela.png" alt=""></span>
        <span>
          <strong>Universidade Cruzeiro do Sul</strong>
        </span>
      </a>

      <section class="card qr-card">
        <img src="qrcode.png" alt="QR Code">
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="nav-item" data-redirect>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        Início
      </a>
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
        Documentos
      </a>
      <a class="nav-item" data-redirect>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9"/><path d="M12 8v13"/><path d="M12 8S10.5 3 7.5 4.5 9 8 12 8zM12 8s1.5-5 4.5-3.5S15 8 12 8z"/></svg>
        Ofertas
      </a>
      <a class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        QR Code
      </a>
    </nav>
  </div>

  <script>
    // Mesmo endereço usado no script.js para os links com data-redirect.
    const REDIRECT_URL = "https://www.cruzeirodosul.edu.br/";
    document.querySelectorAll("[data-redirect]").forEach((link) => {
      link.href = REDIRECT_URL;
    });
  </script>
</body>
</html>
